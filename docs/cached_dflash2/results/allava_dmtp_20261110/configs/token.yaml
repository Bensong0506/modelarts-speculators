# Paths are private and must be supplied by the operator.
# All arms start from the SAME initial dense checkpoint, not dense epoch 5.
dense_checkpoint: ${DFLASH2_INITIAL}
shared: ${DFLASH2_SHARED}
manifest: ${ALLAVA_CACHE_MANIFEST}
output: ${EXPERIMENT_ROOT}/token-kl-3e-5
arm: token
fusion_init: residual-zero
objective: kl
lr: 3e-5
epochs: 5
warmup_fraction: 0.2
batch_sequences: 32
context_token_budget: 48000
anchors: 64
eval_batch_sequences: 4
eval_anchors: 8
seed: 280
memory_limit_gib: 96
cache_target_precision: fp8
